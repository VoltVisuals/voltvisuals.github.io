<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — VoltVisuals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%238187FF'/><path d='M18 6L10 18h5l-1 8 8-12h-5l1-8z' fill='white'/></svg>">
  <script src="js/theme.js"></script>
  <script>SiteTheme.init();</script>
</head>
<body class="auth-page">
  <div class="bg-mesh"></div>
  <div class="bg-orb bg-orb--1"></div>
  <div class="bg-orb bg-orb--2"></div>
  <div class="bg-noise"></div>

  <div class="auth-wrap">
    <a href="index.html" class="auth-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      На главную
    </a>

    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <svg viewBox="0 0 24 24" fill="none"><path d="M13 2L7 14h4l-1 8 7-11h-4l1-9z" fill="white"/></svg>
        </div>
        <h1>Создать аккаунт</h1>
        <p>Зарегистрируйся, чтобы купить и активировать мод</p>
      </div>

      <form class="auth-form" id="registerForm">
        <div class="form-group">
          <label for="username">Никнейм</label>
          <input type="text" id="username" name="username" placeholder="VoltPlayer" required minlength="3" maxlength="16" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="player@mail.ru" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" placeholder="Минимум 6 символов" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="password2">Повторите пароль</label>
          <input type="password" id="password2" name="password2" placeholder="••••••••" required autocomplete="new-password">
        </div>
        <p class="form-error hidden" id="registerError"></p>
        <button type="submit" class="btn btn--primary btn--lg btn--full">Зарегистрироваться</button>
      </form>

      <p class="auth-switch">
        Уже есть аккаунт? <a href="login.html">Войти</a>
      </p>
      <p class="auth-legal">Регистрируясь, вы соглашаетесь с <a href="terms.html">соглашением</a> и <a href="privacy.html">политикой конфиденциальности</a>.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/cookies.js"></script>
  <script src="js/auth.js"></script>
  <script>
    CookieConsent.init();
    (async () => {
      await Auth.init();
      if (Auth.getCurrentUser()) {
        window.location.href = 'profile.html';
      }

      document.getElementById('registerForm').addEventListener('submit', async e => {
        e.preventDefault();
        const err = document.getElementById('registerError');
        const pw = document.getElementById('password').value;
        const pw2 = document.getElementById('password2').value;

        if (pw !== pw2) {
          err.textContent = 'Пароли не совпадают';
          err.classList.remove('hidden');
          return;
        }

        const btn = e.target.querySelector('button[type="submit"]');
        btn.disabled = true;
        const result = await Auth.register({
          username: document.getElementById('username').value,
          email: document.getElementById('email').value,
          password: pw,
        });
        btn.disabled = false;

        if (!result.ok) {
          err.textContent = result.error;
          err.classList.remove('hidden');
          return;
        }

        window.location.href = 'buy.html';
      });
    })();
  </script>
</body>
</html>
