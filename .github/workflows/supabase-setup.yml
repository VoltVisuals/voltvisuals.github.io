name: Supabase setup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/rpc.sql'
      - 'supabase/schema.sql'
      - '.github/workflows/supabase-setup.yml'

jobs:
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply rpc.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref njgdqgrugpvaptfzejdv --password "$SUPABASE_DB_PASSWORD"
          supabase db query --linked -f supabase/rpc.sql
      - name: Deploy vv-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy vv-api --use-api --project-ref njgdqgrugpvaptfzejdv --no-verify-jwt
